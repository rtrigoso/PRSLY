name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install awk and gawk
        run: sudo apt-get install -y gawk

      - name: Lint awk files
        run: make lint

      - name: Run tests
        run: make test
